# Dedicated VirtualBox guest only. Avoid DNS access to the private home LAN.
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
      dhcp6: false
      accept-ra: false
      dhcp4-overrides:
        use-dns: false
        use-domains: false
      nameservers:
        addresses: [1.1.1.1, 9.9.9.9]
