[package]
name = "iso2god"
version = "2.0.0"
description = "Digital Forge — Multi-console game conversion and preparation toolkit."
edition = "2024"
license = "MIT"

autobins = false

[lib]
name = "iso2god"
path = "src/lib.rs"

[[bin]]
name = "iso2god"
path = "src/bin/iso2god.rs"

[features]
# Deliberately opt-in hardware/tool-dependent tests for systems on hold.
deferred-console-integration-tests = []

[dependencies]
anyhow = { version = "1.0.97", features = ["backtrace"] }
bitflags = "2.9.0"
base64 = "0.22"
byteorder = "1.5.0"
clap = { version = "4.5.32", features = ["derive"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
futures = "0.3.31"
mega = "0.8.0"
num_enum = "0.7.3"
rayon = "1.10.0"
rpassword = "7.4.0"
reqwest = { version = "0.12.15", features = ["blocking", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
quick-xml = "0.41.0"
sha1 = "0.10.6"
sha2 = "0.10"
tiny_http = "0.12.0"
ureq = { version = "2.12.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
self_update = { version = "1.2.0", default-features = false, features = ["ureq", "native-tls", "github", "checksums"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Foundation", "Win32_System_WindowsProgramming"] }
rfd = "0.15.4"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
self_update = { version = "1.2.0", default-features = false, features = ["ureq", "rustls", "github", "checksums"] }

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
serde-aux = "4.6.0"

[profile.release]
strip = true
lto = true
