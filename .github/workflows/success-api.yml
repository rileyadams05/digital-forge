name: Deploy successful-test reporting API

on:
  push:
    branches: [main]
    paths:
      - "site-api/**"
      - ".github/workflows/success-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy private GitHub reporting Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Worker syntax
        run: node --check site-api/src/index.mjs
      - name: Check Cloudflare deployment configuration
        id: cloudflare
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker deployment skipped: configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID Actions secrets to deploy Worker updates. The existing live Worker is unchanged."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-api
          command: deploy
